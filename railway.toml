# Railway Zero-Secrets Deployment Configuration
# Enhanced with cost-protection guardrails and resource limits

[build]
    # Use minimal build resources
    builder = "NIXPACKS"
    
[deploy]
    # Force minimal instance size for cost protection
    # startCommand will be auto-detected by Nixpacks
    restartPolicyType = "ON_FAILURE"
    restartPolicyMaxRetries = 3
    
    # Health check configuration
    healthcheckPath = "/api/health"
    healthcheckTimeout = 100
    
[phases.setup]
    nixPkgs = ['nodejs', 'python3']
    aptPkgs = ['build-essential', 'libudev-dev']
    
# =============================================================================
# Cost Protection and Deployment Configuration (Documentation)
# =============================================================================
# NOTE: The sections below are for documentation and automation scripts.
# They are not parsed by Railway but are used by:
# - scripts/railway-usage-monitor.mjs
# - scripts/detect-secrets.mjs
# - RAILWAY_DEPLOYMENT.md documentation
# =============================================================================

# Cost Protection Guardrails
# These thresholds are used by railway-usage-monitor.mjs to trigger alerts
[cost_protection]
    # Resource limits (reference values for monitoring)
    max_memory_mb = 512
    max_cpu_cores = 0.5
    
    # Free tier monitoring markers
    enable_usage_monitoring = true
    shutdown_on_limit = true
    
    # Alert thresholds (percentage of free tier)
    warning_threshold = 0.75   # 75% - log warning
    critical_threshold = 0.90  # 90% - send critical alert
    shutdown_threshold = 0.95  # 95% - trigger auto-shutdown
    
# Deployment modes
# Used by detect-secrets.mjs to validate environment configuration
[deployment_modes]
    # zero_secrets: Minimal deployment with no third-party integrations
    # basic: Basic deployment with email and local storage  
    # full: Full deployment with all features
    default_mode = "zero_secrets"